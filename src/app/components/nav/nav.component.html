<nav [class.scrolled]="isScrolled">
  <div class="nav-content">
    <div class="logo" (click)="scrollTo('hero')">MT</div>
    
    <div class="desktop-links">
      @for (link of navLinks; track link.id) {
        <a (click)="scrollTo(link.id)" class="nav-link small-caps">{{ link.label }}</a>
      }
      <a [href]="content.config().portfolioPdf" class="btn-primary" target="_blank">View Portfolio</a>
    </div>

    <button class="mobile-toggle" (click)="toggleMenu()">
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
      <span class="bar" [class.open]="isMobileMenuOpen"></span>
    </button>
  </div>
</nav>

<div class="mobile-drawer" [class.open]="isMobileMenuOpen">
  <div class="drawer-links">
    @for (link of navLinks; track link.id) {
      <a (click)="scrollTo(link.id)" class="nav-link small-caps">{{ link.label }}</a>
    }
    <a [href]="content.config().portfolioPdf" class="btn-primary" target="_blank">View Portfolio</a>
  </div>
</div>
